services:
  # ========== Infrastructure ==========

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kilat-postgres
    environment:
      POSTGRES_USER: kilat
      POSTGRES_PASSWORD: kilat_secret
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kilat-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kilat-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kilat-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kilat-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kilat-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: kilat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - kilat-network

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: kilat-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/kilat-runner
    networks:
      - kilat-network

  # ========== Services ==========

  service-identity:
    build:
      context: ..
      dockerfile: service-identity/Dockerfile
    container_name: kilat-identity
    ports:
      - "8004:8004"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_identity
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      SERVICE_PORT: 8004
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kilat-network

  service-runner:
    build:
      context: ..
      dockerfile: service-runner/Dockerfile
    container_name: kilat-runner
    ports:
      - "8003:8003"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_runner
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8003
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-booking:
    build:
      context: ..
      dockerfile: service-booking/Dockerfile
    container_name: kilat-booking
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_booking
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8001
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      service-identity:
        condition: service_started
    networks:
      - kilat-network

  service-payment:
    build:
      context: ..
      dockerfile: service-payment/Dockerfile
    container_name: kilat-payment
    ports:
      - "8002:8002"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_payment
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      PLATFORM_FEE_PERCENT: 15
      SERVICE_PORT: 8002
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-tracking:
    build:
      context: ..
      dockerfile: service-tracking/Dockerfile
    container_name: kilat-tracking
    ports:
      - "8005:8005"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_tracking
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8005
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-notification:
    build:
      context: ..
      dockerfile: service-notification/Dockerfile
    container_name: kilat-notification
    ports:
      - "8006:8006"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_notification
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8006
      APP_ENV: development
      TEMPLATES_DIR: /app/templates
      FCM_SERVER_KEY: mock-fcm-key
      FCM_PROJECT_ID: kilat-pet-runner
      TWILIO_ACCOUNT_SID: mock-twilio-sid
      TWILIO_AUTH_TOKEN: mock-twilio-token
      TWILIO_FROM_NUMBER: "+60123456789"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: dev@kilat.com
      SMTP_PASSWORD: dev-password
      SMTP_FROM_ADDR: noreply@kilat.com
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-review:
    build:
      context: ..
      dockerfile: service-review/Dockerfile
    container_name: kilat-review
    ports:
      - "8007:8007"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: kilat_review
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8007
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-chat:
    build:
      context: ..
      dockerfile: service-chat/Dockerfile
    container_name: kilat-chat
    ports:
      - "8008:8008"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: service_chat
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kilat-runner
      SERVICE_PORT: 8008
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - kilat-network

  service-incident:
    image: alpine:3.20
    container_name: kilat-incident
    command: ["sh", "-c", "echo service-incident stub ready; exit 0"]
    ports:
      - "8009:8009"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: service_incident
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SUPPORT_AGENT_USER_IDS: ""
      SERVICE_PORT: 8009
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-loyalty:
    image: alpine:3.20
    container_name: kilat-loyalty
    command: ["sh", "-c", "echo service-loyalty stub ready; exit 0"]
    ports:
      - "8010:8010"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: service_loyalty
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8010
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  service-zones:
    image: alpine:3.20
    container_name: kilat-zones
    command: ["sh", "-c", "echo service-zones stub ready; exit 0"]
    ports:
      - "8011:8011"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kilat
      DB_PASSWORD: kilat_secret
      DB_NAME: service_zones
      DB_SSL_MODE: disable
      JWT_SECRET: super-secret-jwt-key-change-me
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_PREFIX: kilat
      SERVICE_PORT: 8011
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kilat-network

  # ========== API Gateway ==========

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: kilat-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: 8080
      UPSTREAM_IDENTITY: http://service-identity:8004
      UPSTREAM_RUNNER: http://service-runner:8003
      UPSTREAM_BOOKING: http://service-booking:8001
      UPSTREAM_PAYMENT: http://service-payment:8002
      UPSTREAM_TRACKING: http://service-tracking:8005
      UPSTREAM_NOTIFICATION: http://service-notification:8006
      UPSTREAM_REVIEW: http://service-review:8007
      UPSTREAM_CHAT: http://service-chat:8008
      UPSTREAM_INCIDENT: http://service-incident:8009
      UPSTREAM_LOYALTY: http://service-loyalty:8010
      UPSTREAM_ZONES: http://service-zones:8011
      RATE_LIMIT_PER_MIN: 200
      APP_ENV: development
    depends_on:
      - service-identity
      - service-runner
      - service-booking
      - service-payment
      - service-tracking
      - service-notification
      - service-review
      - service-chat
      - service-incident
      - service-loyalty
      - service-zones
    networks:
      - kilat-network

volumes:
  pgdata:
  miniodata:

networks:
  kilat-network:
    driver: bridge
