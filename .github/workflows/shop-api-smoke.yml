name: Shop API Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bruno-tests/shop-api/**"
      - ".github/workflows/shop-api-smoke.yml"

jobs:
  bruno-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run collection
        working-directory: bruno-tests/shop-api
        run: bru run --env local --reporter-json results.json
